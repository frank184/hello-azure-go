name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf 'Go files need gofmt:\n%s\n' "$files"
            exit 1
          fi

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build application
        run: go build -o /tmp/hello-azure-go .

      - name: Build container image
        run: docker build --tag hello-azure-go:ci .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
    steps:
      - name: Check Azure deployment configuration
        shell: bash
        run: |
          missing=()
          for name in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            AZURE_RESOURCE_GROUP \
            ACR_NAME \
            CONTAINER_APP_NAME; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf '::error title=Azure deployment is not configured::Missing repository variables: %s\n' "${missing[*]}"
            echo 'Provision the Azure identity, registry, and Container App, then add the required non-secret GitHub repository variables.'
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v7

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Check deployment resources
        shell: bash
        run: |
          az acr show \
            --name "$ACR_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output none
          az extension add --name containerapp --upgrade --yes
          az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output none

      - name: Build and publish image
        shell: bash
        run: |
          registry_server="$(az acr show \
            --name "$ACR_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query loginServer \
            --output tsv)"
          image="$registry_server/hello-azure-go:$GITHUB_SHA"
          az acr login --name "$ACR_NAME"
          docker build --tag "$image" .
          docker push "$image"

      - name: Deploy image to Azure Container Apps
        run: |
          registry_server="$(az acr show \
            --name "$ACR_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query loginServer \
            --output tsv)"
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$registry_server/hello-azure-go:$GITHUB_SHA"
